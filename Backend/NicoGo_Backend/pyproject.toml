[project]
name = "nicago-api"
version = "0.1.0"
description = "API backend para NicoGo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]>=0.35,<0.36",
  "sqlalchemy>=2.0.43,<2.1",
  "alembic>=1.16.5,<1.19",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
  "pyodbc>=5.2,<6",
  "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
